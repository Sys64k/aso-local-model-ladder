name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build & smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: readaloud-web:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name web -p 3000:3000 "$IMAGE"

      - name: Wait for HTTP 200 on /
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "App did not return 200 in time"
          exit 1

      - name: Check /api/health
        run: |
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' http://localhost:3000/api/health)
          echo "HTTP $code"
          cat "$body"; echo
          test "$code" = "200"
          grep -q '"status":"ok"' "$body"

      - name: Check container runs as non-root
        run: |
          uid=$(docker exec web id -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Wait for HEALTHCHECK to report healthy
        run: |
          # The first probe runs one --interval (30s) after start.
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' web)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          docker inspect --format '{{json .State.Health}}' web
          exit 1

      - name: Container logs
        if: always()
        run: docker logs web || true

      - name: Stop container
        if: always()
        run: docker rm -f web || true
